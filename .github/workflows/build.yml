                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """,
              "app/src/main/java/com/mahor/lanremote/MainActivity.kt": """package com.mahor.lanremote

