name: Build LAN Remote APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Complete Android Project
        run: |
          mkdir -p app/src/main/java/com/mahor/lanremote

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LANProximityRemote"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.mahor.lanremote'
              compileSdk 34
              defaultConfig {
                  applicationId "com.mahor.lanremote"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <application
                  android:allowBackup="true"
                  android:label="LAN Smart Remote"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/mahor/lanremote/MainActivity.kt
          package com.mahor.lanremote

          import android.Manifest
          import android.annotation.SuppressLint
          import android.bluetooth.BluetoothManager
          import android.bluetooth.le.ScanCallback
          import android.bluetooth.le.ScanResult
          import android.bluetooth.le.ScanSettings
          import android.content.Context
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.InetAddress
          import java.nio.charset.StandardCharsets
          import java.util.concurrent.Executors

          data class LanTarget(
              val id: String,
              val name: String,
              val ip: String,
              val port: Int,
              var smoothedRssi: Double = -95.0,
              var lastSeen: Long = 0L
          )

          class MainActivity : AppCompatActivity() {
              private val devices = mutableMapOf<String, LanTarget>()
              private var activeDevice: LanTarget? = null
              private var isAutoMode = true

              private lateinit var statusText: TextView
              private lateinit var modeToggleBtn: Button
              private lateinit var deviceSpinner: Spinner
              private lateinit var spinnerAdapter: ArrayAdapter<String>
              private val deviceListLabels = mutableListOf<String>()
              private val deviceListIds = mutableListOf<String>()

              private val udpExecutor = Executors.newSingleThreadExecutor()
              private val uiHandler = Handler(Looper.getMainLooper())

              private fun seedDefaultDevices() {
                  val now = System.currentTimeMillis()
                  devices["LIVING_TV"] = LanTarget("LIVING_TV", "Living Room TV", "192.168.31.101", 9876, -85.0, now)
                  devices["BEDROOM_PC"] = LanTarget("BEDROOM_PC", "Windows 11 PC", "192.168.31.102", 9876, -88.0, now)
                  activeDevice = devices["LIVING_TV"]
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  seedDefaultDevices()
                  buildGlassUi()
                  requestBlePermissions()
              }

              private fun buildGlassUi() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0D1117"))
                      setPadding(48, 64, 48, 48)
                      gravity = Gravity.CENTER_HORIZONTAL
                  }

                  val title = TextView(this).apply {
                      text = "PROXIMITY LAN REMOTE"
                      textSize = 18f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.parseColor("#58A6FF"))
                      letterSpacing = 0.1f
                  }
                  root.addView(title)

                  statusText = TextView(this).apply {
                      text = "Active: ${activeDevice?.name} (${activeDevice?.ip})"
                      textSize = 14f
                      setTextColor(Color.parseColor("#C9D1D9"))
                      setPadding(0, 24, 0, 24)
                  }
                  root.addView(statusText)

                  modeToggleBtn = Button(this).apply {
                      text = "MODE: AUTO PROXIMITY"
                      setTextColor(Color.WHITE)
                      background = pillDrawable("#1F6FEB")
                      setOnClickListener {
                          isAutoMode = !isAutoMode
                          text = if (isAutoMode) "MODE: AUTO PROXIMITY" else "MODE: MANUAL LOCK"
                          background = pillDrawable(if (isAutoMode) "#1F6FEB" else "#8957E5")
                          if (isAutoMode) evaluateProximity()
                      }
                  }
                  root.addView(modeToggleBtn)

                  spinnerAdapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, deviceListLabels)
                  deviceSpinner = Spinner(this).apply {
                      adapter = spinnerAdapter
                      setBackgroundColor(Color.parseColor("#161B22"))
                      setPadding(16, 16, 16, 16)
                  }
                  refreshSpinner()

                  val selectManualBtn = Button(this).apply {
                      text = "SELECT MANUAL DEVICE"
                      setTextColor(Color.WHITE)
                      background = pillDrawable("#21262D")
                      setOnClickListener {
                          val pos = deviceSpinner.selectedItemPosition
                          if (pos in deviceListIds.indices) {
                              isAutoMode = false
                              modeToggleBtn.text = "MODE: MANUAL LOCK"
                              modeToggleBtn.background = pillDrawable("#8957E5")
                              activeDevice = devices[deviceListIds[pos]]
                              updateStatusUi()
                          }
                      }
                  }

                  val rowSelector = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, 32, 0, 48)
                      addView(deviceSpinner, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                      addView(selectManualBtn, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                  }
                  root.addView(rowSelector)

                  val buttons = listOf(
                      listOf("POWER" to "KEY_POWER", "MUTE" to "KEY_MUTE"),
                      listOf("UP" to "KEY_UP"),
                      listOf("LEFT" to "KEY_LEFT", "OK" to "KEY_ENTER", "RIGHT" to "KEY_RIGHT"),
                      listOf("DOWN" to "KEY_DOWN"),
                      listOf("BACK" to "KEY_BACK", "HOME" to "KEY_HOME"),
                      listOf("VOL -" to "KEY_VOLDOWN", "PLAY/PAUSE" to "KEY_PLAYPAUSE", "VOL +" to "KEY_VOLUP")
                  )

                  for (row in buttons) {
                      val rowLayout = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER
                          setPadding(0, 12, 0, 12)
                      }
                      for ((label, cmd) in row) {
                          val btn = Button(this).apply {
                              text = label
                              setTextColor(Color.WHITE)
                              background = pillDrawable("#21262D")
                              setPadding(36, 28, 36, 28)
                              setOnClickListener { sendLanCommand(cmd) }
                          }
                          val params = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                              setMargins(10, 0, 10, 0)
                          }
                          rowLayout.addView(btn, params)
                      }
                      root.addView(rowLayout)
                  }
                  setContentView(root)
              }

              private fun pillDrawable(hex: String) = GradientDrawable().apply {
                  setColor(Color.parseColor(hex))
                  cornerRadius = 24f
              }

              private fun sendLanCommand(command: String) {
                  val target = activeDevice ?: return
                  udpExecutor.execute {
                      try {
                          val socket = DatagramSocket()
                          val payload = "MAHOR_REMOTE|${target.id}|$command".toByteArray(StandardCharsets.UTF_8)
                          val packet = DatagramPacket(payload, payload.size, InetAddress.getByName(target.ip), target.port)
                          socket.send(packet)
                          socket.close()
                      } catch (e: Exception) {
                          uiHandler.post {
                              Toast.makeText(this, "LAN Error: ${e.message}", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }

              private fun requestBlePermissions() {
                  val perms = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      arrayOf(Manifest.permission.BLUETOOTH_SCAN, Manifest.permission.BLUETOOTH_CONNECT)
                  } else {
                      arrayOf(Manifest.permission.ACCESS_FINE_LOCATION)
                  }
                  if (perms.any { ActivityCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }) {
                      ActivityCompat.requestPermissions(this, perms, 101)
                  } else {
                      startBleScanner()
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 101 && grantResults.all { it == PackageManager.PERMISSION_GRANTED }) {
                      startBleScanner()
                  }
              }

              @SuppressLint("MissingPermission")
              private fun startBleScanner() {
                  val btManager = getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
                  val scanner = btManager.adapter?.bluetoothLeScanner ?: return
                  val settings = ScanSettings.Builder().setScanMode(ScanSettings.SCAN_MODE_LOW_LATENCY).build()

                  scanner.startScan(null, settings, object : ScanCallback() {
                      override fun onScanResult(callbackType: Int, result: ScanResult) {
                          val advName = result.device.name ?: result.scanRecord?.deviceName ?: return
                          if (advName.startsWith("LANREM|")) {
                              val parts = advName.split("|")
                              if (parts.size == 4) {
                                  val id = parts[1]
                                  val ip = parts[2]
                                  val port = parts[3].toIntOrNull() ?: 9876
                                  val now = System.currentTimeMillis()
                                  val target = devices.getOrPut(id) {
                                      LanTarget(id, id, ip, port, result.rssi.toDouble(), now)
                                  }
                                  target.smoothedRssi = (0.35 * result.rssi) + (0.65 * target.smoothedRssi)
                                  target.lastSeen = now
                                  refreshSpinner()
                                  if (isAutoMode) evaluateProximity()
                              }
                          }
                      }
                  })
              }

              private fun evaluateProximity() {
                  val now = System.currentTimeMillis()
                  val recent = devices.values.filter { now - it.lastSeen < 5000 }
                  val strongest = recent.maxByOrNull { it.smoothedRssi } ?: return
                  val current = activeDevice

                  if (current == null || (strongest.id != current.id && strongest.smoothedRssi > current.smoothedRssi + 8.0)) {
                      activeDevice = strongest
                      updateStatusUi()
                  }
              }

              private fun updateStatusUi() {
                  uiHandler.post {
                      val dev = activeDevice
                      statusText.text = "Active: ${dev?.name} (${dev?.ip}) | Signal: ${dev?.smoothedRssi?.toInt()} dBm"
                  }
              }

              private fun refreshSpinner() {
                  uiHandler.post {
                      deviceListLabels.clear()
                      deviceListIds.clear()
                      devices.values.forEach {
                          deviceListLabels.add("${it.name} (${it.ip})")
                          deviceListIds.add(it.id)
                      }
                      spinnerAdapter.notifyDataSetChanged()
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LAN-Proximity-Remote-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
